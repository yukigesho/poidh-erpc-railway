---
logLevel: info

# Redis persists this small cache across eRPC/indexer restarts. In Railway, set
# REDIS_URL as a reference to the private Redis service's REDIS_URL variable.
database:
  evmJsonRpcCache:
    connectors:
      - id: cache-redis
        driver: redis
        redis:
          uri: "${REDIS_URL}"
    policies:
      # Immutable historical/indexer data: retain only one day to keep Redis
      # bounded while covering ordinary indexer restarts and re-runs.
      - connector: cache-redis
        method: "eth_get*|eth_query*"
        finality: finalized
        ttl: 24h
      # Transaction/hash lookups have no reliable finality reference.
      - connector: cache-redis
        method: "eth_getTransactionByHash|eth_getTransactionReceipt"
        finality: unknown
        ttl: 24h
      # Do not preserve potentially reorgable or tip-of-chain values long.
      - connector: cache-redis
        method: "eth_get*|eth_query*"
        finality: unfinalized
        ttl: 15s
      - connector: cache-redis
        method: "eth_blockNumber|eth_gasPrice|eth_feeHistory"
        finality: realtime
        ttl: 2s

healthCheck:
  mode: simple
  # Provider-only projects pass without forcing a live upstream RPC call.
  defaultEval: "all:activeUpstreams"

server:
  # Railway health checks and private networking connect over IPv4.
  listenV4: true
  listenV6: false
  httpHostV4: "0.0.0.0"
  httpPortV4: 4000

metrics:
  enabled: true
  hostV4: "0.0.0.0"
  hostV6: "[::]"
  port: 4001

projects:
  - id: main
    auth:
      strategies:
        - type: secret
          secret:
            value: "${ERPC_AUTH_SECRET}"

    networkDefaults:
      selectionPolicy:
        evalInterval: 15s
        evalScope: network-method
        # Alchemy is the sole provider; select its healthiest upstream first.
        evalFunc: |
          (upstreams, ctx) => upstreams
            .removeCordoned()
            .sortByScore(PREFER_FASTEST)
      failsafe:
        - matchMethod: "*"
          timeout:
            duration: 30s
          retry:
            maxAttempts: 2
            delay: 200ms
            jitter: 100ms
            backoffFactor: 1.5
            backoffMaxDelay: 2s
          # No speculative second request while the primary call is in flight.
          hedge:
            maxCount: 0

    upstreamDefaults:
      jsonRpc:
        # Public endpoints do not consistently support batching.
        supportsBatch: false
      failsafe:
        - matchMethod: "*"
          timeout:
            duration: 3s
          retry:
            maxAttempts: 1
          circuitBreaker:
            failureThresholdCount: 5
            failureThresholdCapacity: 10
            halfOpenAfter: 30s
            successThresholdCount: 2
            successThresholdCapacity: 3

    providers:
      # eRPC generates each chain's Alchemy URL from this single API key.
      - id: alchemy
        vendor: alchemy
        settings:
          apiKey: "${ALCHEMY_API_KEY}"
        onlyNetworks:
          - evm:1
          - evm:42161
          - evm:8453
        overrides:
          "*":
            tags: ["tier:primary", "provider:alchemy"]

    networks:
      - architecture: evm
        evm:
          chainId: 1
        alias: mainnet
      - architecture: evm
        evm:
          chainId: 42161
        alias: arbitrum
      - architecture: evm
        evm:
          chainId: 8453
        alias: base
