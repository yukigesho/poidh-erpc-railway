global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/ponder-alerts.yml

scrape_configs:
  - job_name: erpc
    metrics_path: /metrics
    static_configs:
      # Name the Railway RPC service "erpc", or change this hostname.
      - targets: ["erpc.railway.internal:4001"]

  - job_name: ponder
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      # Match the indexer's Railway private hostname and PORT.
      - targets: ["indexer.railway.internal:42069"]
